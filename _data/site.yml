faq:
  eyebrow: FAQ
  heading: Common questions
  items:
    - question: What does the $500 cover?
      answer: "Design and build of a custom site (typically up to 5 pages: home, services, about, gallery or menu, contact), mobile optimization, contact form, Google Map and hours, basic on-page SEO, and setting up hosting and your domain. Two rounds of changes are included. This $500 price is for the first 10 local clients."
    - question: When do I pay?
      answer: You pay the $500 only after you're 100% happy with the site. Nothing is due before then.
    - question: What does hosting cost?
      answer: "If I host the site for you, it's $15/month or $150/year. That covers the domain, hosting and small edits. If you'd rather run it yourself, I hand the site over free. You own the domain (about $11/year), and later edits are $40 each. Those are the only ongoing costs."
    - question: How long does it take?
      answer: Most sites are ready to launch in one to two weeks, depending on how quickly I get your photos, logo and text.
    - question: Do I own the website?
      answer: Yes. With the free handover, the domain is registered in your name and the site files are yours. If I host it for you, I can still hand it over later at no extra charge.
    - question: What if I already have a website?
      answer: If your current site is slow, outdated or hard to use on a phone, I can rebuild it for the same $500 first-10 price and move your domain over.
    - question: What do later edits cost?
      answer: "On the we-host plan ($15/month or $150/year), small edits are included. If you take the free handover, later edits are $40 each."

