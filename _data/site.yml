faq:
  eyebrow: FAQ
  heading: Common questions
  items:
    - question: What does the $1,000 cover?
      answer: "Design and build of a custom site (typically up to 5 pages: home, services, about, gallery or menu, contact), mobile optimization, contact form, Google Map and hours, basic on-page SEO, and setting up hosting and your domain."
    - question: Are there monthly fees?
      answer: "No monthly fee to me. You'll pay your domain registrar directly (usually about $10–$20 a year). Many small sites can be hosted free or very cheaply. Optional updates and maintenance can be arranged if you want them."
    - question: How long does it take?
      answer: Most sites are ready to launch in one to two weeks, depending on how quickly I get your photos, logo and text.
    - question: Do I own the website?
      answer: Yes. The domain is registered in your name and the site files are yours.
    - question: What if I already have a website?
      answer: If your current site is slow, outdated or hard to use on a phone, I can rebuild it for the same flat price and move your domain over.
    - question: How do I pay?
      answer: Typically half to start and half at launch. Payment details are confirmed in your quote.

